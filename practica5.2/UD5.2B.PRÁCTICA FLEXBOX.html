<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarjeta Perfil</title>
    <link rel="stylesheet" href="ud5_2practica.css"> <!-- ¡Asegúrate de que este nombre es correcto! -->
</head>
<body>

    <div class="card">
        <!-- CABECERA -->
        <div class="header">
            <div class="avatar"></div>
            <div class="user-info">
                <h3>Juan Nadie</h3>
                <p>Frontend Developer</p>
            </div>
        </div>

        <!-- BIO -->
        <p class="bio">Apasionado por el CSS y los diseños limpios. Aprendiendo Flexbox hoy mismo.</p>

        <!-- ESTADÍSTICAS -->
        <div class="stats">
            <div class="stat-item">
                <strong>1.2k</strong>
                <span>Seguidores</span>
            </div>
            <div class="stat-item">
                <strong>45</strong>
                <span>Posts</span>
            </div>
            <div class="stat-item">
                <strong>800</strong>
                <span>Likes</span>
            </div>
        </div>

        <!-- BOTONES -->
        <div class="actions">
            <button class="btn-primary">Seguir</button>
            <button class="btn-secondary">Msn</button>
        </div>
    </div>

</body>
</html>
